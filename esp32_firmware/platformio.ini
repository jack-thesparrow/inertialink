[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; huge_app partition: app0 = 3 MB instead of the default 1.25 MB.
; Required because WiFi alone is ~600 KB; add MPU6050 + OLED and we
; would overflow the default partition without this.
board_build.partitions = huge_app.csv

lib_deps =
    rfetick/MPU6050_light @ ^1.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

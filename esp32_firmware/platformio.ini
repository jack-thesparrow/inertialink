[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; huge_app partition: app0 = 3 MB (0x300000) instead of the default 1.25 MB.
; This is necessary because BluetoothSerial + WiFi together exceed 1.25 MB.
board_build.partitions = huge_app.csv

lib_deps =
    rfetick/MPU6050_light @ ^1.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
